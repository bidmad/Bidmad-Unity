apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'ad.helper.openbidding:admob-obh:3.28.1' // Assets/Bidmad/Editor/OBHDependencies.xml:11
    implementation 'com.adop.sdk.adapter:admob:25.4.0.0' // Assets/Bidmad/Editor/OBHDependencies.xml:13
    implementation 'com.adop.sdk.adapter:applovin:13.6.2.1' // Assets/Bidmad/Editor/OBHDependencies.xml:14
    implementation 'com.adop.sdk.adapter:fyber:8.4.6.0' // Assets/Bidmad/Editor/OBHDependencies.xml:15
    implementation 'com.adop.sdk.adapter:ortb:1.0.3' // Assets/Bidmad/Editor/OBHDependencies.xml:16
    implementation 'com.adop.sdk.adapter:pangle:8.1.0.3.0' // Assets/Bidmad/Editor/OBHDependencies.xml:17
    implementation 'com.adop.sdk.adapter:taboola:4.0.38.0' // Assets/Bidmad/Editor/OBHDependencies.xml:18
    implementation 'com.adop.sdk.adapter:unityads:4.19.0.0' // Assets/Bidmad/Editor/OBHDependencies.xml:19
    implementation 'com.adop.sdk.adapter:vungle:7.7.7.0' // Assets/Bidmad/Editor/OBHDependencies.xml:20
    implementation 'com.adop.sdk.partners:admobbidding:1.1.6' // Assets/Bidmad/Editor/OBHDependencies.xml:21
    implementation 'com.adop.sdk:bidmad-androidx:3.28.2' // Assets/Bidmad/Editor/OBHDependencies.xml:12
// Android Resolver Dependencies End
**DEPS**}

// Android Resolver Exclusions Start
android {
    ndkVersion "**NDKVERSION**"
  packaging {
      exclude ('/lib/arm64-v8a/*' + '*')
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    compileSdkVersion **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
            abiFilters **ABIFILTERS**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}

**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
